version: "3.1"

intents:
  - greet
  - goodbye
  - ask_symptoms
  - ask_vaccination
  - ask_outbreak_info
  - ask_emergency
  - ask_general_health
  - ask_medication
  - bot_challenge
  - ask_hospitals
  - ask_location
  - ask_cost
  - affirm
  - deny
  - ask_prevention
  - ask_exercise
  - ask_diet
  - ask_mental_health
  # New intents added with multilingual support
  - ask_prevention_tips
  - ask_medicine_info
  - ask_hospital_info
  - ask_health_scheme
  - emergency_help
  - thank
  - out_of_scope
  # nlu_fallback removed to disable fallback intent

entities:
  - symptom
  - location
  - age
  - gender
  - severity
  - duration
  - vaccine_type
  - disease
  - medicine
  - scheme

slots:
  user_name:
    type: text
    mappings:
    - type: from_text
      conditions:
      - active_loop: name_form
        requested_slot: user_name

  location:
    type: text
    mappings:
    - type: from_entity
      entity: location

  age:
    type: float
    mappings:
    - type: from_entity
      entity: age

  symptom:
    type: text
    mappings:
    - type: from_entity
      entity: symptom

  severity:
    type: text
    mappings:
    - type: from_entity
      entity: severity

  duration:
    type: text
    mappings:
    - type: from_entity
      entity: duration

  vaccine_type:
    type: text
    mappings:
    - type: from_entity
      entity: vaccine_type

  disease:
    type: text
    mappings:
    - type: from_entity
      entity: disease

  medicine:
    type: text
    mappings:
    - type: from_entity
      entity: medicine

  scheme:
    type: text
    mappings:
    - type: from_entity
      entity: scheme

responses:
  utter_greet:
  - text: "Hello! I'm your health assistant. How can I help you today? 🏥\n\nI can help with:\n• Symptoms and health guidance\n• Vaccination information\n• Hospital locations\n• Medicine information\n• Emergency contacts"
  - text: "नमस्ते! मैं आपका स्वास्थ्य सहायक हूं। आज मैं आपकी कैसे मदद कर सकता हूं? 🏥"
  - text: "వనక్కం! నేను మీ ఆరోగ్య సహాయకుడను. నేను మీకు ఎలా సహాయం చేయగలను? 🏥"

  utter_goodbye:
  - text: "Goodbye! Take care of your health. For emergencies, call 108. 🏥"
  - text: "अलविदा! अपना ख्याल रखें। आपातकाल के लिए 108 पर कॉल करें। 🏥"
  - text: "వీడ్కోలు! మీ ఆరోగ్యాన్ని జాగ్రత్తగా చూసుకోండి। అత్యవసర సమయాల్లో 108కి కాల్ చేయండి। 🏥"

  utter_default:
  - text: "I didn't understand that. I can help with health information, symptoms, vaccinations, and hospital locations. What would you like to know?"
  - text: "मुझे समझ नहीं आया। मैं स्वास्थ्य जानकारी, लक्षण, टीकाकरण और अस्पताल की जानकारी में मदद कर सकता हूं।"
  - text: "Could you please rephrase that? I'm here to help with:\n• Health symptoms and advice\n• Hospital and doctor information\n• Vaccination schedules\n• Emergency guidance"
  - text: "I'm not sure I understand. Try asking me about:\n• 'I have fever'\n• 'Find hospitals near me'\n• 'COVID vaccine info'\n• 'Emergency help'"

  utter_please_rephrase:
  - text: "I'm sorry, I didn't understand that. Could you please rephrase your question? I'm here to help with health-related queries."
  - text: "क्षमा करें, मुझे समझ नहीं आया। कृपया अपना प्रश्न दूसरे तरीके से पूछें।"

  utter_emergency:
  - text: "🚨 EMERGENCY ALERT! 🚨\n\nCall 108 immediately for medical emergency!\n\nEmergency Numbers:\n• Ambulance: 108\n• Police: 100\n• Fire: 101\n\nIf you're having:\n• Chest pain\n• Difficulty breathing\n• Severe bleeding\n• Loss of consciousness\n\nSeek immediate medical attention!"
  - text: "🚨 आपातकाल! 🚨\n\nतुरंत 108 पर कॉल करें!\n\nआपातकालीन नंबर:\n• एम्बुलेंस: 108\n• पुलिस: 100\n• फायर: 101"

  utter_symptoms_help:
  - text: "I can help you understand your symptoms. Please describe:\n• What symptoms are you experiencing?\n• How long have you had them?\n• How severe are they (mild/moderate/severe)?\n\n⚠️ For emergency symptoms, call 108 immediately!"
  - text: "मैं आपके लक्षणों को समझने में मदद कर सकता हूं। कृपया बताएं:\n• आपको कौन से लक्षण हैं?\n• कितने समय से हैं?\n• कितने गंभीर हैं?"

  utter_vaccination_info:
  - text: "💉 Vaccination Information:\n\n🏥 Where to get vaccinated:\n• Government hospitals\n• PHCs and CHCs\n• Private hospitals\n• CoWIN centers\n\n📋 Required documents:\n• Aadhaar card\n• Voter ID\n• Driving license\n\n📱 Book online: CoWIN portal or Aarogya Setu app"
  - text: "💉 टीकाकरण की जानकारी:\n\n🏥 टीका कहाँ लगवाएं:\n• सरकारी अस्पताल\n• PHC और CHC\n• निजी अस्पताल\n• CoWIN केंद्र"

  utter_vaccination_covid:
  - text: "🦠 COVID-19 Vaccination:\n\n💉 Available vaccines:\n• Covishield\n• Covaxin\n• Sputnik V\n• Corbevax\n\n👥 Eligible: 12+ years\n📅 Gap between doses: 84 days\n🆓 Free at government centers\n\n📱 Book: CoWIN portal"
  - text: "🦠 कोविड-19 टीकाकरण:\n\n💉 उपलब्ध टीके:\n• कोविशील्ड\n• कोवैक्सिन\n• स्पुतनिक V\n• कॉर्बेवैक्स"

  utter_general_health:
  - text: "🏥 General Health Tips:\n\n✅ Daily habits:\n• Drink 8-10 glasses of water\n• Exercise 30 minutes daily\n• Sleep 7-8 hours\n• Eat balanced diet\n\n🥗 Include:\n• Fruits and vegetables\n• Whole grains\n• Lean proteins\n\n❌ Avoid:\n• Smoking\n• Excessive alcohol\n• Processed foods"
  - text: "🏥 सामान्य स्वास्थ्य टिप्स:\n\n✅ दैनिक आदतें:\n• 8-10 गिलास पानी पिएं\n• 30 मिनट व्यायाम करें\n• 7-8 घंटे सोएं"

  utter_general_health_detailed:
  - text: "🏥 Detailed Health Guidelines:\n\n🏃‍♂️ Physical Activity:\n• Walking: 30 min daily\n• Yoga: 15-20 min\n• Strength training: 2-3 times/week\n\n🥗 Nutrition:\n• 5 servings fruits/vegetables\n• Whole grains over refined\n• Limit sugar and salt\n\n🧠 Mental Health:\n• Practice meditation\n• Maintain social connections\n• Manage stress effectively"

  utter_ask_severity:
  - text: "To better help you, please tell me:\n\n📊 How severe are your symptoms?\n• Mild (manageable, doesn't interfere with daily activities)\n• Moderate (somewhat bothersome, affects some activities)\n• Severe (very bothersome, significantly affects daily life)\n\n⏰ How long have you had these symptoms?"
  - text: "बेहतर मदद के लिए, कृपया बताएं:\n\n📊 आपके लक्षण कितने गंभीर हैं?\n• हल्के\n• मध्यम\n• गंभीर"

  utter_ask_hospitals:
  - text: "🏥 I can help you find hospitals. Please tell me:\n\n📍 Your location (city/area)\n🏥 Type of hospital needed:\n• Emergency\n• General\n• Specialty (cardiology, orthopedic, etc.)\n• Government or Private\n\nThis will help me find the best options for you!"
  - text: "🏥 मैं अस्पताल खोजने में मदद कर सकता हूं। कृपया बताएं:\n\n📍 आपका स्थान\n🏥 अस्पताल का प्रकार"

  utter_outbreak_info:
  - text: "🦠 Disease Outbreak Information:\n\n📱 Official sources:\n• Ministry of Health & Family Welfare\n• WHO updates\n• State health departments\n\n🚨 Current alerts:\n• Check IDSP (Integrated Disease Surveillance)\n• Local health department notifications\n\n📞 Report suspicious cases to:\n• District health officer\n• Helpline: 1075"

  utter_medication_info:
  - text: "💊 Medicine Information:\n\n⚠️ Important:\n• Always consult a doctor before taking medicines\n• Check expiry dates\n• Follow prescribed dosage\n• Store medicines properly\n\n🏪 Where to buy:\n• Licensed pharmacies\n• Jan Aushadhi stores (generic medicines)\n• Online pharmacies (with valid prescription)"
  - text: "💊 दवा की जानकारी:\n\n⚠️ महत्वपूर्ण:\n• दवा लेने से पहले डॉक्टर से सलाह लें\n• एक्सपायरी डेट चेक करें"

  utter_mental_health:
  - text: "🧠 Mental Health Support:\n\n📞 Helplines:\n• National Mental Health: 1800-599-0019\n• Vandrevala Foundation: 1860-2662-345\n• NIMHANS: 080-46110007\n\n💡 Self-care tips:\n• Practice deep breathing\n• Maintain routine\n• Stay connected with loved ones\n• Seek professional help when needed"

  utter_prevention_tips:
  - text: "🛡️ Disease Prevention Tips:\n\n✋ Basic hygiene:\n• Wash hands frequently (20 seconds)\n• Use hand sanitizer (60%+ alcohol)\n• Avoid touching face\n• Cover mouth when coughing/sneezing\n\n🏠 At home:\n• Keep surroundings clean\n• Ensure proper ventilation\n• Maintain physical distance when sick"

  utter_iamabot:
  - text: "I am a health chatbot created to help you with medical information and health guidance. I'm here 24/7 to assist you! 🤖🏥"

  utter_cost_info:
  - text: "💰 Treatment Cost Information:\n\n🆓 Free services:\n• Government hospitals\n• PHCs and CHCs\n• Ayushman Bharat scheme\n• Jan Aushadhi medicines\n\n💵 Cost factors:\n• Type of treatment\n• Hospital (govt vs private)\n• Insurance coverage\n• Location\n\n📋 Financial assistance:\n• PM-JAY scheme\n• State health schemes\n• Hospital charity funds"

actions:
- action_check_vaccine_schedule
- action_get_symptom_info
- action_send_outbreak_alert
- action_get_prevention_tips
- action_get_vaccination_info
- action_get_outbreak_info
- action_check_health_status
- action_find_nearest_hospital
- action_get_medicine_info
- action_get_emergency_contacts
- validate_name_form
- action_symptom_analysis
- action_find_hospitals

forms:
  name_form:
    required_slots:
      - user_name
