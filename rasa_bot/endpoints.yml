version: "3.1"

action_endpoint:
  url: "http://localhost:5055/webhook"  # Aligned with start script

tracker_store:
  type: sql
  dialect: "sqlite"
  url: "sqlite:///rasa.db"

# Kafka event broker (optional). Comment out if Kafka not running locally to prevent connection errors.
event_broker:
  type: kafka
  url: localhost:9292
  topic: rasa_events
