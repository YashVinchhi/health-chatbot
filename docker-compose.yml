version: '3.8'

services:
  rasa:
    build: 
      context: ./rasa_bot
      dockerfile: Dockerfile
    ports:
      - "5005:5005"  # Standard RASA HTTP API port
    volumes:
      - ./rasa_bot:/app
      - rasa_models:/app/models
      - rasa_cache:/app/.rasa
    environment:
      - PYTHONPATH=/app
      - RASA_ACTIONS_URL=http://rasa-actions:5055/webhook
      - SQLALCHEMY_SILENCE_UBER_WARNING=1
    command: ["run", "--enable-api", "--cors", "*", "--endpoints", "endpoints.yml", "--port", "5005"]
    depends_on:
      - rasa-actions
      - db
      - kafka

  rasa-actions:
    build:
      context: ./rasa_bot
      dockerfile: actions.Dockerfile
    ports:
      - "5055:5055"  # Standard actions server port
    environment:
      - PYTHONPATH=/app
      - BACKEND_URL=http://backend:8000
      - SQLALCHEMY_SILENCE_UBER_WARNING=1
    command: ["run", "actions", "--port", "5055"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - RASA_URL=http://rasa:5005
      - RASA_ACTIONS_URL=http://rasa-actions:5055
    volumes:
      - ./backend:/app
    networks:
      - health-chatbot-network
    depends_on:
      - rasa

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - health-chatbot-network
    depends_on:
      - backend

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=healthbot
    ports:
      - "5632:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2281:2281"
    environment:
      ZOO_PORT: 2281
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2281"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    ports:
      - "9292:9292"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2281
      KAFKA_ADVERTISED_PORT: 9292
      KAFKA_CREATE_TOPICS: "rasa_events:1:1"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --bootstrap-server localhost:9292"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rasa_models:
  rasa_cache:

networks:
  health-chatbot-network:
    driver: bridge
